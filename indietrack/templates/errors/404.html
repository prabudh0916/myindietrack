{% extends "base.html" %}
{% block title %}Page Not Found (404) — IndieTrack{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 col-lg-5 text-center">
    <div class="indie-card p-5">
      <div class="text-warning mb-3">
        <i class="bi bi-disc display-1"></i>
      </div>
      <h1 class="h3 fw-bold mb-2">Track Not Found (404)</h1>
      <p class="text-secondary mb-4">
        The record, release, or page you were looking for does not exist or may have been relocated.
      </p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-indie-primary">Go to Dashboard</a>
        <a href="{{ url_for('main.index') }}" class="btn btn-indie-outline">Home</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
