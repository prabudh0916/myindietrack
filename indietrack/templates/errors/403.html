{% extends "base.html" %}
{% block title %}Access Denied (403) — IndieTrack{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 col-lg-5 text-center">
    <div class="indie-card p-5">
      <div class="text-danger mb-3">
        <i class="bi bi-shield-x display-1"></i>
      </div>
      <h1 class="h3 fw-bold mb-2">Access Denied (403)</h1>
      <p class="text-secondary mb-4">
        You do not possess the required ownership permissions or administrative credentials to access this protected resource.
      </p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-indie-primary">Return to Dashboard</a>
        <a href="{{ url_for('main.index') }}" class="btn btn-indie-outline">Home</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
